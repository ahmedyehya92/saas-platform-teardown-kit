<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">SaaS Platform Teardown Kit — a magnifying lens inspecting an exploded stack of web, desktop, and mobile app layers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="0.6" stop-color="#312E81"/>
      <stop offset="1" stop-color="#131A3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F09074" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F09074" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lens">
      <circle cx="318" cy="224" r="112"/>
    </clipPath>
  </defs>

  <!-- app-icon ground -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="246" r="210" fill="url(#glow)"/>
  <circle cx="110" cy="92" r="130" fill="url(#glowCoral)"/>

  <!-- sparkles -->
  <path d="M104,66 Q104,86 124,86 Q104,86 104,106 Q104,86 84,86 Q104,86 104,66 Z" fill="#F09074"/>
  <path d="M444,99 Q444,110 455,110 Q444,110 444,121 Q444,110 433,110 Q444,110 444,99 Z" fill="#FFFFFF" opacity="0.85"/>
  <path d="M86,401 Q86,414 99,414 Q86,414 86,427 Q86,414 73,414 Q86,414 86,401 Z" fill="#FFFFFF" opacity="0.45"/>

  <!-- exploded platform stack: web / desktop / mobile -->
  <g>
    <rect x="136" y="118" width="240" height="58" rx="14" fill="#818CF8"/>
    <rect x="168" y="141" width="76" height="12" rx="6" fill="#FFFFFF" opacity="0.92"/>
    <rect x="136" y="209" width="240" height="58" rx="14" fill="#6366F1"/>
    <rect x="168" y="232" width="76" height="12" rx="6" fill="#FFFFFF" opacity="0.92"/>
    <rect x="136" y="300" width="240" height="58" rx="14" fill="#4F46E5"/>
    <rect x="168" y="323" width="76" height="12" rx="6" fill="#FFFFFF" opacity="0.92"/>
  </g>

  <!-- layers seen through the lens: brighter, inspected -->
  <g clip-path="url(#lens)">
    <rect x="136" y="118" width="240" height="58" rx="14" fill="#C7D2FE"/>
    <rect x="168" y="141" width="76" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="136" y="209" width="240" height="58" rx="14" fill="#A5B4FC"/>
    <rect x="168" y="232" width="76" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="136" y="300" width="240" height="58" rx="14" fill="#818CF8"/>
    <rect x="168" y="323" width="76" height="12" rx="6" fill="#FFFFFF"/>
  </g>

  <!-- magnifying lens + coral handle -->
  <circle cx="318" cy="224" r="112" fill="#FFFFFF" opacity="0.07"/>
  <line x1="394" y1="300" x2="464" y2="370" stroke="#E8846B" stroke-width="34" stroke-linecap="round"/>
  <line x1="402" y1="308" x2="446" y2="352" stroke="#F4A78C" stroke-width="10" stroke-linecap="round"/>
  <circle cx="318" cy="224" r="112" fill="none" stroke="#EEF2FF" stroke-width="18"/>

  <!-- inner bevel -->
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
</svg>
